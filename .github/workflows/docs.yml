name: docs

on:
  push:
    branches: ["**"] # branches only; tags never deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.map.outputs.version }}
      alias: ${{ steps.map.outputs.alias }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict

      # Branch -> docs version. Branches not listed here build but never deploy.
      - name: Map branch to version
        id: map
        run: |
          case "$GITHUB_REF_NAME" in
            v2)   version=v2;  alias=latest ;;
            v1)   version=v1;  alias=     ;;
            main) version=dev; alias=     ;;
            *)    version=;    alias=     ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "Branch '$GITHUB_REF_NAME' -> version '${version:-<none>}' alias '${alias:-<none>}'"

  deploy:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    # Only deploys write to gh-pages, so only deploys share this queue.
    # Build-only runs on other branches can't cancel a waiting deploy.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mike needs full history and the gh-pages ref

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy with mike
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ALIAS: ${{ needs.build.outputs.alias }}
        run: |
          git config user.name "nish8d"
          git config user.email "184851041+nish8d@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true # absent on the very first deploy
          if [ -n "$ALIAS" ]; then
            mike deploy --push --update-aliases "$VERSION" "$ALIAS"
            mike set-default --push "$ALIAS"
          else
            mike deploy --push "$VERSION"
          fi
